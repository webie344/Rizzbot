<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>REALISTIC GTA STYLE - FIXED</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="rotateDevice">
        <div class="icon">↻</div>
        <h2>PLEASE ROTATE YOUR DEVICE</h2>
        <p>Landscape mode required</p>
    </div>

    <div id="gameContainer"></div>

    <div id="damageVignette"></div>

    <div id="hudTopLeft">
        <div id="healthBarWrap">
            <div id="healthBarFill"></div>
            <div id="healthText"><span id="healthValue">100</span></div>
        </div>
        <div id="scoreChip"><span class="chip-label">SCORE</span><span id="scoreValue">0</span></div>
    </div>

    <div id="hudTopRight">
        <div id="killsChip"><span class="chip-label">KILLS</span><span id="killsValue">0</span></div>
    </div>

    <div id="minimap"><canvas id="minimapCanvas" width="200" height="200"></canvas></div>
    <div id="crosshair"></div>

    <div id="movementIndicator"><span>SPEED</span><span id="movementSpeed">0</span></div>
    <div id="doorIndicator">🚪 TAP SHOOT TO ENTER</div>

    <div id="joystickContainer"><div id="joystickBase"><div id="joystickThumb"></div></div></div>
    <div id="viewSwipeZone"></div>

    <div id="ammoCounter">
        <span id="ammoValue">30</span><span id="ammoMax">/30</span>
    </div>

    <div id="quickActions">
        <div class="action-btn small" id="punchBtn">🥊</div>
        <div class="action-btn small" id="kickBtn">🦵</div>
        <div class="action-btn small" id="rollBtn">🌀</div>
        <div class="action-btn small" id="waveBtn">👋</div>
    </div>

    <div id="actionButtons">
        <div class="action-btn" id="shootBtn">🔫</div>
        <div class="action-btn" id="reloadBtn">🔄</div>
        <div class="action-btn" id="zoomBtn">🔍</div>
        <div class="action-btn" id="actionsBtn">⚡</div>
    </div>

    <div id="animMenu">
        <div id="animMenuInner">
            <div class="anim-menu-header">
                <h3>ACTIONS</h3>
                <div class="anim-menu-close" id="animMenuClose">✕</div>
            </div>
            <div id="animMenuGrid"></div>
        </div>
    </div>

    <div id="gameOverlay"><div id="gameOverMenu"><h1>GAME OVER</h1><h2 id="finalScore">Score: 0</h2><button id="restartBtn">PLAY AGAIN</button></div></div>

    <div id="instructions">
        <h2>🎮 GTA STYLE REALISM 🎮</h2>
        <button id="startBtn">START GAME</button>
    </div>

    <!-- ==================== LOGIN OVERLAY ==================== -->
    <div id="loginOverlay">
        <div id="loginBox">
            <h2>LOG IN TO PLAY</h2>
            <p class="login-sub">Sign in to fight other players</p>
            <input type="email" id="loginEmail" placeholder="Email" autocomplete="email">
            <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
            <button id="loginSubmitBtn">LOG IN</button>
            <button id="loginGuestBtn">Play as Guest</button>
            <div id="loginError"></div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module" src="game.js"></script>
</body>
</html>
