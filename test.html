<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLB Inspector</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: #1a1a2e; color: white; font-family: monospace; display: flex; overflow: hidden; }
  
  #viewer { flex: 1; position: relative; min-height: 200px; background: #1a1a2e; }
  #viewer canvas { display: block; width: 100%; height: 100%; }
  
  #info { 
    width: 320px; background: #16213e; padding: 12px; overflow-y: auto; 
    border-left: 1px solid #2a3a5e; font-size: 12px;
  }
  
  h2 { color: #ffaa00; font-size: 12px; margin-bottom: 8px; }
  #drop { 
    border: 2px dashed #ffaa00; border-radius: 10px; padding: 14px; text-align: center; 
    cursor: pointer; margin-bottom: 10px; background: #1e2a4a; font-size: 13px;
  }
  #drop:hover { background: #2a3a5e; }
  .anim { 
    background: #2a3a5e; padding: 6px 10px; border-radius: 8px; font-size: 11px;
    border-left: 3px solid #ffaa00; display: flex; justify-content: space-between; 
    align-items: center; margin-bottom: 5px;
  }
  .anim button {
    background: #ffaa00; color: #1a1a2e; border: none; padding: 4px 10px; 
    border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 10px;
  }
  #status { color: #88aacc; margin-bottom: 6px; font-size: 11px; word-wrap: break-word; }
  #fileName { color: #44ff44; font-weight: bold; margin-bottom: 6px; word-break: break-all; font-size: 12px; }
  #error { color: #ff6666; font-size: 11px; margin-bottom: 6px; }
  
  /* MOBILE: stack vertically, viewer on top, panel on bottom */
  @media (max-width: 900px) {
    body { flex-direction: column; }
    #viewer { flex: 1; min-height: 0; }
    #info { 
      width: 100%; height: 45%; border-left: none; border-top: 2px solid #2a3a5e;
      padding: 10px;
    }
    .anim { font-size: 11px; padding: 6px 8px; }
  }
</style>
</head>
<body>

<div id="viewer"></div>

<div id="info">
  <h2>GLB INSPECTOR</h2>
  <div id="drop">📁 Tap to choose your .glb file</div>
  <div id="fileName">No file loaded</div>
  <div id="status">Waiting...</div>
  <div id="error"></div>
  <h2>ANIMATIONS</h2>
  <div id="animations"></div>
  <input type="file" id="fileInput" accept=".glb,.gltf" style="display:none">
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const viewer = document.getElementById('viewer');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a2a4e);

// Get actual viewer size
const W = viewer.clientWidth || window.innerWidth;
const H = viewer.clientHeight || window.innerHeight * 0.5;

const camera = new THREE.PerspectiveCamera(50, W / H, 0.01, 1000);
camera.position.set(0, 1.5, 4);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W, H, false);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
viewer.appendChild(renderer.domElement);

// Lights
scene.add(new THREE.AmbientLight(0xffffff, 1.0));
const key = new THREE.DirectionalLight(0xffffff, 1.5);
key.position.set(3, 5, 3);
scene.add(key);
const fill = new THREE.DirectionalLight(0x88aaff, 0.8);
fill.position.set(-3, 2, -3);
scene.add(fill);

// Grid ground
const grid = new THREE.GridHelper(20, 20, 0x6666aa, 0x333355);
scene.add(grid);

// Touch/mouse drag to orbit
let rotY = 0, rotX = 0.2;
let isDragging = false, prevX = 0, prevY = 0;
const el = renderer.domElement;

el.addEventListener('mousedown', e => { isDragging = true; prevX = e.clientX; prevY = e.clientY; });
el.addEventListener('touchstart', e => { 
  isDragging = true; prevX = e.touches[0].clientX; prevY = e.touches[0].clientY;
}, { passive: true });

window.addEventListener('mouseup', () => isDragging = false);
window.addEventListener('touchend', () => isDragging = false);

window.addEventListener('mousemove', e => {
  if (!isDragging) return;
  rotY -= (e.clientX - prevX) * 0.01;
  rotX -= (e.clientY - prevY) * 0.01;
  rotX = Math.max(-0.5, Math.min(1.2, rotX));
  prevX = e.clientX; prevY = e.clientY;
});

window.addEventListener('touchmove', e => {
  if (!isDragging) return;
  rotY -= (e.touches[0].clientX - prevX) * 0.01;
  rotX -= (e.touches[0].clientY - prevY) * 0.01;
  rotX = Math.max(-0.5, Math.min(1.2, rotX));
  prevX = e.touches[0].clientX; prevY = e.touches[0].clientY;
}, { passive: true });

let mixer = null;
let currentModel = null;
let actions = {};
let modelHeight = 1.5;

const loader = new GLTFLoader();

function loadGLB(file) {
  const url = URL.createObjectURL(file);
  document.getElementById('fileName').textContent = file.name;
  document.getElementById('status').textContent = 'Loading...';
  document.getElementById('error').textContent = '';

  if (currentModel) scene.remove(currentModel);
  if (mixer) mixer.stopAllAction();

  loader.load(url, (gltf) => {
    currentModel = gltf.scene;
    scene.add(currentModel);

    const box = new THREE.Box3().setFromObject(currentModel);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    modelHeight = size.y;

    currentModel.position.x -= center.x;
    currentModel.position.z -= center.z;
    currentModel.position.y -= box.min.y;

    let meshCount = 0;
    currentModel.traverse(n => { if (n.isMesh) meshCount++; });

    document.getElementById('status').textContent = 
      `Loaded: ${gltf.animations.length} anim, ${meshCount} mesh`;

    mixer = new THREE.AnimationMixer(currentModel);
    actions = {};
    const animList = document.getElementById('animations');
    animList.innerHTML = '';

    gltf.animations.forEach(clip => {
      const action = mixer.clipAction(clip);
      actions[clip.name] = action;

      const div = document.createElement('div');
      div.className = 'anim';
      div.innerHTML = `<span>${clip.name}</span><button>PLAY</button>`;
      div.querySelector('button').addEventListener('click', () => {
        Object.values(actions).forEach(a => a.stop());
        actions[clip.name].reset().play();
        document.getElementById('status').textContent = 'Playing: ' + clip.name;
      });
      animList.appendChild(div);
    });

    if (actions['Idle']) actions['Idle'].play();
    else if (gltf.animations[0]) actions[gltf.animations[0].name].play();

  }, undefined, (err) => {
    console.error(err);
    document.getElementById('error').textContent = 'ERROR: ' + err.message;
  });
}

const fileInput = document.getElementById('fileInput');
document.getElementById('drop').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => {
  if (e.target.files[0]) loadGLB(e.target.files[0]);
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  if (mixer) mixer.update(clock.getDelta());

  const dist = Math.max(2, modelHeight * 2.5);
  camera.position.x = Math.sin(rotY) * dist * Math.cos(rotX);
  camera.position.z = Math.cos(rotY) * dist * Math.cos(rotX);
  camera.position.y = modelHeight * 0.7 + Math.sin(rotX) * dist;
  camera.lookAt(0, modelHeight * 0.5, 0);

  renderer.render(scene, camera);
}
animate();

// Handle resize
function resize() {
  const w = viewer.clientWidth;
  const h = viewer.clientHeight;
  if (w > 0 && h > 0) {
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h, false);
  }
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
setTimeout(resize, 100);
</script>
</body>
</html>
